---
- name: Deploy Application to Kubernetes Cluster
  hosts: localhost
  connection: local
  tasks:
    - name: Load Docker Image into Minikube
      command: minikube image load ultimate-devops-app:v1.0.7
      ignore_errors: yes

    - name: Ensure Kubernetes deployment is applied
      command: "kubectl apply -f {{ playbook_dir }}/../k8s/deployment.yaml"
