apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultimate-devops-app
  labels:
    app: ultimate-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ultimate-devops-app
  template:
    metadata:
      labels:
        app: ultimate-devops-app
    spec:
      containers:
      - name: devops-app
        image: ultimate-devops-app:v1.0.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ultimate-devops-service
spec:
  type: NodePort
  selector:
    app: ultimate-devops-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
